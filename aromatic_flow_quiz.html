<!DOCTYPE html>

        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            user-select: none;
        }

        .canvas-grid {
            background-image: radial-gradient(#334155 1.2px, transparent 1.2px);

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;

            background: #0f172a;
        }

            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .katex-display {
            margin: 0.15em 0 !important;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(99, 102, 241, 0.8); }
            50% { border-color: rgba(165, 180, 252, 0.3); }
        }
        .pulse-border {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;

                <button id="mode-structure" onclick="setQuizMode('structure')" class="px-3 py-1.5 rounded-lg font-medium transition bg-indigo-600 text-white shadow">
                    <i class="fa-solid fa-shapes mr-1"></i> 構造式選択
                </button>
                <button id="mode-name" onclick="setQuizMode('name')" class="px-3 py-1.5 rounded-lg font-medium transition text-slate-300 hover:text-white">
                    <i class="fa-solid fa-font mr-1"></i> 物質名選択
                </button>
                <button id="mode-condition" onclick="setQuizMode('condition')" class="px-3 py-1.5 rounded-lg font-medium transition text-slate-300 hover:text-white">
                    <i class="fa-solid fa-vial mr-1"></i> 反応条件穴埋め
                </button>
            </div>

            <!-- Score Badge Display -->
            <div id="score-badge" class="hidden bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium">

                <i class="fa-solid fa-rotate-right"></i> リセット
            </button>
            <button id="btn-reveal" onclick="revealAllAnswers()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 text-xs font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                <i class="fa-solid fa-eye"></i> 全正解表示

            <button onclick="openEncyclopedia()" class="bg-amber-600/90 hover:bg-amber-600 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-lg shadow-amber-600/20 transition flex items-center gap-1.5">

    <div class="flex-1 relative flex overflow-hidden bg-slate-950">

    <!-- Modal: Structure & Name Selector Palette -->

            </div>
            <div class="px-6 py-3.5 bg-slate-950 border-t border-slate-800 flex justify-between items-center">
                <button onclick="clearCurrentNodeSelection()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold px-3.5 py-2 rounded-xl border border-rose-500/30 hover:bg-rose-500/10 transition">

                <button onclick="closeSelectorModal()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-5 py-2 rounded-xl transition">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

        // Universal Helper: KaTeX inline renderer with multi-backslash protection
        function formatMath(str) {
            if (!str) return '';
            return str.replace(/\$([^$]+)\$/g, (match, tex) => {
                try {
                    return katex.renderToString(tex, { throwOnError: false, displayMode: false });
                } catch (e) {
                    console.error('KaTeX rendering error:', e, tex);
                    return tex;
                }
            });
        }

        function createStructureSVG(compoundId, size = 110) {
            const width = size;
            const height = size;
            const cx = width / 2;
            const cy = height / 2 + 6;
            const r = size * 0.22;

            const angles = [-90, -30, 30, 90, 150, 210].map(a => a * Math.PI / 180);
            const pts = angles.map(a => ({
                x: cx + r * Math.cos(a),
                y: cy + r * Math.sin(a)
            }));

            const ptsStr = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

            if (compoundId === 'p_hydroxyazobenzene') {
                return `
                <svg width="${width}" height="${height}" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg" class="select-none pointer-events-none">
                    <polygon points="30,30 45,21 60,30 60,48 45,57 30,48" stroke="#38bdf8" fill="none" stroke-width="2"/>
                    <circle cx="45" cy="39" r="9" stroke="#38bdf8" fill="none" stroke-width="1.5"/>
                    <text x="16" y="42" font-size="11" font-weight="bold" fill="#38bdf8">HO</text>
                    <line x1="28" y1="39" x2="30" y2="39" stroke="#38bdf8" stroke-width="2"/>
                    
                    <line x1="60" y1="39" x2="72" y2="39" stroke="#94a3b8" stroke-width="2"/>
                    <text x="73" y="43" font-size="11" font-weight="bold" fill="#f43f5e">-N=N-</text>
                    <line x1="108" y1="39" x2="120" y2="39" stroke="#94a3b8" stroke-width="2"/>

                    <polygon points="120,30 135,21 150,30 150,48 135,57 120,48" stroke="#38bdf8" fill="none" stroke-width="2"/>
                    <circle cx="135" cy="39" r="9" stroke="#38bdf8" fill="none" stroke-width="1.5"/>
                </svg>`;
            }

            let svgInner = `
                <polygon points="${ptsStr}" stroke="#38bdf8" fill="none" stroke-width="2.2" stroke-linejoin="round"/>
                <circle cx="${cx}" cy="${cy}" r="${r * 0.65}" stroke="#38bdf8" fill="none" stroke-width="1.8"/>
            `;

            const addSubstituent = (posIdx, text, color = '#f8fafc', dyOffset = 0) => {
                const pt = pts[posIdx];
                let lx = pt.x;
                let ly = pt.y;
                let tx = pt.x;
                let ty = pt.y;
                let anchor = 'middle';

                const bondLen = 14;
                if (posIdx === 0) {
                    ly -= bondLen;
                    ty = ly - 3;
                } else if (posIdx === 1) {
                    lx += bondLen * 0.86;
                    ly -= bondLen * 0.5;
                    tx = lx + 3;
                    ty = ly + 3;
                    anchor = 'start';
                } else if (posIdx === 3) {
                    ly += bondLen;
                    ty = ly + 11;
                } else if (posIdx === 5) {
                    lx -= bondLen * 0.86;
                    ly -= bondLen * 0.5;
                    tx = lx - 3;
                    ty = ly + 3;
                    anchor = 'end';
                }

                svgInner += `<line x1="${pt.x}" y1="${pt.y}" x2="${lx}" y2="${ly}" stroke="#94a3b8" stroke-width="2"/>`;
                svgInner += `<text x="${tx}" y="${ty + dyOffset}" font-size="11" font-weight="bold" fill="${color}" text-anchor="${anchor}">${text}</text>`;
            };

            switch (compoundId) {
                case 'benzene': break;
                case 'toluene': addSubstituent(0, 'CH₃', '#f8fafc'); break;
                case 'nitrobenzene': addSubstituent(0, 'NO₂', '#f43f5e'); break;
                case 'benzenesulfonic_acid': addSubstituent(0, 'SO₃H', '#fbbf24'); break;
                case 'chlorobenzene': addSubstituent(0, 'Cl', '#34d399'); break;
                case 'cumene': addSubstituent(0, 'CH(CH₃)₂', '#f8fafc'); break;
                case 'benzoic_acid': addSubstituent(0, 'COOH', '#60a5fa'); break;
                case 'sodium_benzoate': addSubstituent(0, 'COONa', '#60a5fa'); break;
                case 'aniline': addSubstituent(0, 'NH₂', '#a78bfa'); break;
                case 'acetanilide': addSubstituent(0, 'NHCOCH₃', '#a78bfa'); break;
                case 'diazonium': addSubstituent(0, 'N₂⁺Cl⁻', '#f43f5e'); break;
                case 'phenol': addSubstituent(0, 'OH', '#34d399'); break;
                case 'sodium_phenoxide': addSubstituent(0, 'O⁻Na⁺', '#34d399'); break;
                case 'cumene_hydroperoxide': addSubstituent(0, 'C(CH₃)₂OOH', '#f8fafc'); break;
                case 'tribromophenol':
                    addSubstituent(0, 'OH', '#34d399');
                    addSubstituent(1, 'Br', '#fb923c');
                    addSubstituent(3, 'Br', '#fb923c');
                    addSubstituent(5, 'Br', '#fb923c');
                    break;
                case 'sodium_salicylate':
                    addSubstituent(0, 'COONa', '#60a5fa');
                    addSubstituent(1, 'OH', '#34d399');
                    break;
                case 'salicylic_acid':
                    addSubstituent(0, 'COOH', '#60a5fa');
                    addSubstituent(1, 'OH', '#34d399');
                    break;
                case 'methyl_salicylate':
                    addSubstituent(0, 'COOCH₃', '#60a5fa');
                    addSubstituent(1, 'OH', '#34d399');
                    break;
                case 'acetylsalicylic_acid':
                    addSubstituent(0, 'COOH', '#60a5fa');
                    addSubstituent(1, 'OCOCH₃', '#a78bfa');
                    break;
            }

            return `
            <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" class="select-none pointer-events-none">
                ${svgInner}
            </svg>`;
        }

                    }
                } else if (isFixed) {
                    badge = `<div class="absolute -top-2 -right-2 bg-indigo-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow">起点</div>`;
                }

                nodeEl.innerHTML = `
                    ${badge}
                    ${headerContent}
                    <div class="flex-1 w-full flex items-center justify-center overflow-hidden">
                        ${bodyGraphic}
                    </div>
                `;

                nodeEl.onclick = (e) => {
                    e.stopPropagation();
                    if (isEvaluated || isFixed) {
                        openExplanation(comp.id);
                    } else {
                        if (quizMode === 'structure') {
                            openSelectorModal(comp.id);
                        } else if (quizMode === 'name') {
                            openNameModal(comp.id);
                        } else {
                            openExplanation(comp.id);
                        }
                    }
                };

                container.appendChild(nodeEl);
            });
        }

        function renderOrthogonalEdges() {
            const svg = document.getElementById('arrows-svg');
            const labelsContainer = document.getElementById('arrow-labels-container');
            
            svg.querySelectorAll('.ortho-path').forEach(el => el.remove());
            labelsContainer.innerHTML = '';

            const nodeW = 150;
            const nodeH = 135;

            EDGES.forEach((edge) => {
                const fromNode = COMPOUNDS[edge.from];
                const toNode = COMPOUNDS[edge.to];
                if (!fromNode || !toNode) return;

                let startX, startY, endX, endY;
                let pathD = '';
                let labelPos = { x: 0, y: 0 };

                if (edge.custom) {
                    const c = edge.custom;
                    
                    if (c.startSide === 'bottom') {
                        startX = fromNode.pos.x + nodeW * (c.startXRatio !== undefined ? c.startXRatio : 0.5);
                        startY = fromNode.pos.y + nodeH;
                    } else if (c.startSide === 'right') {
                        startX = fromNode.pos.x + nodeW;
                        startY = fromNode.pos.y + nodeH * (c.startYRatio !== undefined ? c.startYRatio : 0.5);
                    } else if (c.startSide === 'left') {
                        startX = fromNode.pos.x;
                        startY = fromNode.pos.y + nodeH * (c.startYRatio !== undefined ? c.startYRatio : 0.5);
                    } else {
                        startX = fromNode.pos.x + nodeW * (c.startXRatio !== undefined ? c.startXRatio : 0.5);
                        startY = fromNode.pos.y;
                    }

                    if (c.endSide === 'left') {
                        endX = toNode.pos.x;
                        endY = toNode.pos.y + nodeH * (c.endYRatio !== undefined ? c.endYRatio : 0.5);
                    } else if (c.endSide === 'top') {
                        endX = toNode.pos.x + nodeW * (c.endXRatio !== undefined ? c.endXRatio : 0.5);
                        endY = toNode.pos.y;
                    } else if (c.endSide === 'bottom') {
                        endX = toNode.pos.x + nodeW * (c.endXRatio !== undefined ? c.endXRatio : 0.5);
                        endY = toNode.pos.y + nodeH;
                    } else {
                        endX = toNode.pos.x;
                        endY = toNode.pos.y + nodeH / 2;
                    }

                    if (c.midY !== undefined) {
                        pathD = `M ${startX} ${startY} L ${startX} ${c.midY} L ${endX} ${c.midY} L ${endX} ${endY}`;
                        labelPos = { x: (startX + endX) / 2, y: c.midY };
                    } else if (c.midX !== undefined) {
                        pathD = `M ${startX} ${startY} L ${c.midX} ${startY} L ${c.midX} ${endY} L ${endX} ${endY}`;
                        labelPos = { x: c.midX, y: (startY + endY) / 2 };
                    } else {
                        pathD = `M ${startX} ${startY} L ${endX} ${endY}`;
                        labelPos = { x: (startX + endX) / 2, y: (startY + endY) / 2 };
                    }

                    if (c.labelX !== undefined) labelPos.x = c.labelX;
                    if (c.labelY !== undefined) labelPos.y = c.labelY;

                } else {
                    const fCenter = { x: fromNode.pos.x + nodeW / 2, y: fromNode.pos.y + nodeH / 2 };
                    const tCenter = { x: toNode.pos.x + nodeW / 2, y: toNode.pos.y + nodeH / 2 };

                    const dx = tCenter.x - fCenter.x;
                    const dy = tCenter.y - fCenter.y;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) {
                            startX = fromNode.pos.x + nodeW;
                            startY = fCenter.y;
                            endX = toNode.pos.x;
                            endY = tCenter.y;
                        } else {
                            startX = fromNode.pos.x;
                            startY = fCenter.y;
                            endX = toNode.pos.x + nodeW;
                            endY = tCenter.y;
                        }
                        const midX = (startX + endX) / 2;
                        pathD = `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`;
                        labelPos = { x: midX, y: (startY + endY) / 2 };
                    } else {
                        if (dy > 0) {
                            startX = fCenter.x;
                            startY = fromNode.pos.y + nodeH;
                            endX = tCenter.x;
                            endY = toNode.pos.y;
                        } else {
                            startX = fCenter.x;
                            startY = fromNode.pos.y;
                            endX = tCenter.x;
                            endY = toNode.pos.y + nodeH;
                        }
                        const midY = (startY + endY) / 2;
                        pathD = `M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`;
                        labelPos = { x: (startX + endX) / 2, y: midY };
                    }
                }

                let strokeColor = '#64748b';
                let markerId = 'url(#arrowhead)';

                if (isEvaluated && quizMode === 'condition') {
                    if (userConditionSelections[edge.id] === edge.label) {
                        strokeColor = '#10b981';
                        markerId = 'url(#arrowhead-correct)';
                    } else {
                        strokeColor = '#f43f5e';
                        markerId = 'url(#arrowhead-wrong)';
                    }
                }

                const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('d', pathD);
                pathEl.setAttribute('class', 'ortho-path');
                pathEl.setAttribute('stroke', strokeColor);
                pathEl.setAttribute('stroke-width', '2.5');
                pathEl.setAttribute('fill', 'none');
                pathEl.setAttribute('marker-end', markerId);
                svg.appendChild(pathEl);

                const labelDiv = document.createElement('div');
                
                if (quizMode === 'condition') {
                    const selVal = userConditionSelections[edge.id];
                    let badgeBorder = 'border-slate-700 bg-slate-900/95 text-amber-300';
                    let labelContent = '';

                    if (isEvaluated) {
                        if (selVal === edge.label) {
                            badgeBorder = 'border-emerald-500 bg-emerald-950 text-emerald-300';
                            labelContent = formatMath(edge.label);
                        } else {
                            badgeBorder = 'border-rose-500 bg-rose-950 text-rose-300';
                            labelContent = selVal ? formatMath(selVal) : '<span class="text-rose-400 font-bold">未選択</span>';
                        }
                    } else if (selVal) {
                        labelContent = formatMath(selVal);
                        badgeBorder = 'border-indigo-500 bg-slate-900 text-indigo-300';
                    } else {
                        labelContent = '<span class="text-indigo-400 font-bold"><i class="fa-solid fa-vial mr-1"></i>条件を選択</span>';
                    }

                    labelDiv.className = `condition-badge absolute transform -translate-x-1/2 -translate-y-1/2 border px-2.5 py-1 rounded-xl shadow-lg text-[11px] font-medium pointer-events-auto hover:border-indigo-400 transition cursor-pointer z-30 ${badgeBorder}`;
                    labelDiv.innerHTML = labelContent;
                    
                    const handleConditionClick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openConditionModal(edge);
                    };

                    labelDiv.onmousedown = (e) => e.stopPropagation();
                    labelDiv.ontouchstart = (e) => e.stopPropagation();
                    labelDiv.onclick = handleConditionClick;

                } else {
                    labelDiv.className = 'arrow-label absolute transform -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 backdrop-blur border border-slate-800 text-slate-200 px-2.5 py-1 rounded-xl shadow-lg text-[11px] font-medium pointer-events-auto hover:border-indigo-500 transition cursor-pointer z-20';
                    labelDiv.style.left = `${labelPos.x}px`;
                    labelDiv.style.top = `${labelPos.y}px`;
                    labelDiv.innerHTML = formatMath(edge.label);
                    labelDiv.title = edge.desc;
                    labelDiv.onmousedown = (e) => e.stopPropagation();
                    labelDiv.ontouchstart = (e) => e.stopPropagation();
                    labelDiv.onclick = (e) => {
                        e.stopPropagation();
                        showCustomNotification('反応詳細', edge.desc);
                    };
                }

                labelDiv.style.left = `${labelPos.x}px`;
                labelDiv.style.top = `${labelPos.y}px`;

                labelsContainer.appendChild(labelDiv);
            });
        }

        function openSelectorModal(nodeId) {
            currentEditingNode = nodeId;
            const modalTitle = document.getElementById('modal-selector-title');
            modalTitle.innerHTML = `<i class="fa-solid fa-shapes text-indigo-400"></i> 構造式を選択してください`;
            
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            Object.keys(COMPOUNDS).forEach(key => {
                const comp = COMPOUNDS[key];
                const card = document.createElement('div');
                card.className = 'bg-slate-900 rounded-2xl border border-slate-800 hover:border-indigo-500 p-3 flex flex-col items-center justify-between cursor-pointer transition transform hover:-translate-y-1 shadow-md';
                
                card.innerHTML = `
                    <div class="w-full h-24 flex items-center justify-center p-1">
                        ${createStructureSVG(comp.id, 95)}
                    </div>
                    <button class="w-full mt-2 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white text-xs font-semibold py-1.5 rounded-xl border border-indigo-500/30 transition">
                        この構造式を選択
                    </button>
                `;

                card.onclick = () => {
                    if (currentEditingNode) {
                        userSelections[currentEditingNode] = comp.id;
                        renderNodes();
                        closeSelectorModal();
                    }
                };

                grid.appendChild(card);
            });

            document.getElementById('selector-modal').classList.remove('hidden');
        }

        function openNameModal(nodeId) {
            currentEditingNode = nodeId;
            const modalTitle = document.getElementById('modal-selector-title');
            modalTitle.innerHTML = `<i class="fa-solid fa-font text-indigo-400"></i> 物質名を選択してください`;

            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            Object.keys(COMPOUNDS).forEach(key => {
                const comp = COMPOUNDS[key];
                const card = document.createElement('div');
                card.className = 'bg-slate-900 rounded-2xl border border-slate-800 hover:border-indigo-500 p-4 flex flex-col items-center justify-center cursor-pointer transition transform hover:-translate-y-1 text-center shadow-md';
                
                card.innerHTML = `
                    <div class="font-bold text-white text-sm mb-1">${comp.name}</div>
                    <div class="text-xs text-indigo-400 font-medium">${formatMath(comp.formula)}</div>
                `;

                card.onclick = () => {
                    if (currentEditingNode) {
                        userSelections[currentEditingNode] = comp.id;
                        renderNodes();
                        closeSelectorModal();
                    }
                };

                grid.appendChild(card);
            });

            document.getElementById('selector-modal').classList.remove('hidden');
        }

        function closeSelectorModal() {
            document.getElementById('selector-modal').classList.add('hidden');
            currentEditingNode = null;
        }

        function clearCurrentNodeSelection() {
            if (currentEditingNode && currentEditingNode !== 'benzene') {
                delete userSelections[currentEditingNode];
                renderNodes();
                closeSelectorModal();
            }
        }

        function openConditionModal(edge) {
            currentEditingEdge = edge;
            const grid = document.getElementById('condition-grid');
            grid.innerHTML = '';

            const choices = Array.from(new Set(EDGES.map(e => e.label)));

            choices.forEach(label => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-slate-950 hover:bg-indigo-950/60 border border-slate-800 hover:border-indigo-500 p-3.5 rounded-2xl transition flex items-center justify-between group shadow-sm';
                btn.innerHTML = `
                    <span class="text-slate-200 text-xs font-semibold group-hover:text-white">${formatMath(label)}</span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-600 group-hover:text-indigo-400"></i>
                `;
                btn.onclick = () => {
                    userConditionSelections[edge.id] = label;
                    renderOrthogonalEdges();
                    closeConditionModal();
                };
                grid.appendChild(btn);
            });

            document.getElementById('condition-modal').classList.remove('hidden');
        }

        function closeConditionModal() {
            document.getElementById('condition-modal').classList.add('hidden');
            currentEditingEdge = null;
        }

        function openExplanation(compoundId) {
            const comp = COMPOUNDS[compoundId];
            if (!comp) return;

            document.getElementById('exp-title').innerText = comp.name;
            document.getElementById('exp-formula').innerHTML = formatMath(comp.formula);
            document.getElementById('exp-properties').innerHTML = formatMath(comp.properties);
            document.getElementById('exp-reactions').innerHTML = formatMath(comp.reactions);
            document.getElementById('exp-exam-notes').innerHTML = formatMath(comp.examNotes);
            document.getElementById('exp-svg-box').innerHTML = createStructureSVG(comp.id, 80);

            document.getElementById('explanation-modal').classList.remove('hidden');
        }

        function closeExplanationModal() {
            document.getElementById('explanation-modal').classList.add('hidden');
        }

        function renderEncyclopedia() {
            const grid = document.getElementById('encyclopedia-grid');
            grid.innerHTML = '';

            Object.values(COMPOUNDS).forEach(comp => {
                const card = document.createElement('div');
                card.className = 'enc-card bg-slate-900 rounded-2xl border border-slate-800 p-4 shadow-md flex flex-col justify-between space-y-3';
                card.dataset.search = (comp.name + comp.formula + comp.properties + comp.reactions + comp.examNotes).toLowerCase();

                card.innerHTML = `
                    <div class="flex items-center space-x-3 border-b border-slate-800 pb-3">
                        <div class="w-16 h-16 bg-slate-950 rounded-xl flex items-center justify-center border border-slate-800 flex-shrink-0">
                            ${createStructureSVG(comp.id, 60)}
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-sm">${comp.name}</h4>
                            <p class="text-xs text-indigo-400 font-semibold">${formatMath(comp.formula)}</p>
                        </div>
                    </div>
                    <div class="text-[11px] text-slate-300 space-y-2 leading-relaxed">
                        <p><strong class="text-amber-400">【特徴】</strong> ${formatMath(comp.properties)}</p>
                        <p><strong class="text-emerald-400">【反応】</strong> ${formatMath(comp.reactions)}</p>
                        <p><strong class="text-indigo-400">【重要度】</strong> ${formatMath(comp.examNotes)}</p>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterEncyclopedia() {
            const q = document.getElementById('encyclopedia-search').value.toLowerCase();
            document.querySelectorAll('.enc-card').forEach(card => {
                const text = card.dataset.search;
                card.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }

        function openEncyclopedia() {
            document.getElementById('encyclopedia-modal').classList.remove('hidden');
        }

        function closeEncyclopedia() {
            document.getElementById('encyclopedia-modal').classList.add('hidden');
        }

        function showCustomNotification(title, text) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl animate-in fade-in zoom-in-95">
                    <div class="w-12 h-12 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto text-xl">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <h3 class="font-bold text-white text-base">${title}</h3>
                    <p class="text-xs text-slate-300 leading-relaxed">${text}</p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-xl transition">
                        理解しました
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function checkAnswers() {
            isEvaluated = true;
            let correctCount = 0;

            if (quizMode === 'condition') {
                const total = EDGES.length;
                EDGES.forEach(edge => {
                    if (userConditionSelections[edge.id] === edge.label) correctCount++;
                });
                const scoreBadge = document.getElementById('score-badge');
                const scoreText = document.getElementById('score-text');
                scoreBadge.classList.remove('hidden');
                scoreText.innerText = `${correctCount} / ${total} 正解 (${Math.round(correctCount / total * 100)}%)`;
                renderOrthogonalEdges();

            } else {
                const total = Object.keys(COMPOUNDS).length - 1;
                Object.keys(COMPOUNDS).forEach(id => {
                    if (id === 'benzene') return;
                    if (userSelections[id] === id) correctCount++;
                });
                const scoreBadge = document.getElementById('score-badge');
                const scoreText = document.getElementById('score-text');
                scoreBadge.classList.remove('hidden');
                scoreText.innerText = `${correctCount} / ${total} 正解 (${Math.round(correctCount / total * 100)}%)`;
                renderNodes();
            }
        }

        function resetAnswers() {
            userSelections = { 'benzene': 'benzene' };
            userConditionSelections = {};
            isEvaluated = false;
            document.getElementById('score-badge').classList.add('hidden');
            renderNodes();
            renderOrthogonalEdges();
        }

        function revealAllAnswers() {
            Object.keys(COMPOUNDS).forEach(id => { userSelections[id] = id; });
            EDGES.forEach(edge => { userConditionSelections[edge.id] = edge.label; });
            isEvaluated = true;
            checkAnswers();
        }

        function setupPanZoom() {
            const container = document.getElementById('canvas-container');
            const world = document.getElementById('canvas-world');

            const updateTransform = () => {
                world.style.transform = `translate(${currentPan.x}px, ${currentPan.y}px) scale(${zoomLevel})`;
            };

            container.addEventListener('mousedown', (e) => {
                if (e.target.closest('.chem-node') || 
                    e.target.closest('.condition-badge') || 
                    e.target.closest('.arrow-label') || 
                    e.target.closest('#selector-modal') || 
                    e.target.closest('#condition-modal') || 
                    e.target.closest('#explanation-modal') || 
                    e.target.closest('#encyclopedia-modal')) return;
                isDragging = true;
                startPan = { x: e.clientX - currentPan.x, y: e.clientY - currentPan.y };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentPan = { x: e.clientX - startPan.x, y: e.clientY - startPan.y };
                updateTransform();
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // Touch drag support
            let startTouch = { x: 0, y: 0 };
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    if (e.target.closest('.chem-node') || 
                        e.target.closest('.condition-badge') || 
                        e.target.closest('.arrow-label') || 
                        e.target.closest('#selector-modal') || 
                        e.target.closest('#condition-modal')) return;
                    isDragging = true;
                    startTouch = { x: e.touches[0].clientX - currentPan.x, y: e.touches[0].clientY - currentPan.y };
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                currentPan = { x: e.touches[0].clientX - startTouch.x, y: e.touches[0].clientY - startTouch.y };
                updateTransform();
            }, { passive: true });

            window.addEventListener('touchend', () => { isDragging = false; });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                zoomCanvas(zoomFactor);
            }, { passive: false });

            window.zoomCanvas = (factor) => {
                zoomLevel = Math.max(0.45, Math.min(2.0, zoomLevel * factor));
                updateTransform();
            };

            window.resetZoom = () => {
                zoomLevel = 1.0;
                currentPan = { x: 30, y: 15 };
                updateTransform();
            };

            updateTransform();
        }
    </script>
</body>
</html>
